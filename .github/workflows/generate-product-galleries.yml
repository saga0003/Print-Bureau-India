name: Generate Product Galleries

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate-product-galleries.py'
      - '.github/workflows/generate-product-galleries.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate galleries
        run: python tools/generate-product-galleries.py

      - name: Commit generated gallery images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/products
          if git diff --cached --quiet; then
            echo "No gallery image changes to commit."
            exit 0
          fi
          git commit -m "Add product gallery bundles for all printing categories"
          git push
